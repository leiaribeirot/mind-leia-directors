name: director
title: Director
icon: "🧭"
tier: active
status: live
distribution: starter
purpose: >-
  PM + continuous improvement engine: 9-phase scan/prioritize/execute pipeline over any target, plus
  autopilot sprint loop (SM → Dev → QA per story).
entry_points:
  npm:
    - atelier:director:scan
    - atelier:director:status
    - atelier:director:execute
  slash:
    - /director
director:
  scan: true
  lenses:
    - code-quality
    - architecture
    - dx-tooling
    - feature-expansion
  priority_boost: 1.3

# How to CHOOSE this atelier (story 394.14). `purpose` above says it exists; this says when a
# request should come here and, more expensively, when it should not. Single source for both
# readers: the desktop sidebar surface and the generated ateliers/AGENT-CATALOG.md. Never write
# a second description elsewhere. Gate: npm run registry:check.
usage:
  does: >-
    Runs the PM and continuous-improvement engine over any target: scan, prioritize, execute,
    report, and an autopilot sprint loop.
  when:
    - "\"o que fazer agora\""
    - "\"escaneia o atelier X\""
    - "\"roda o sprint\""
    - planning or grooming a backlog
  when_not:
    - writing one story by hand -> the BMAD SM agent
    - reviewing code on a branch, which is not an atelier task
  requires: A valid target from the generated targets list, which comes from the atelier manifests.
  returns: Findings, a prioritized backlog and drafted stories under docs/stories/.
  interface: skill
  interface_reason: >-
    Prioritization is the deliverable and it is an argument, so a person has to be able to disagree
    with it halfway through.
